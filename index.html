lessons.comparison={title:'Meaningful Comparisons · Similes & Metaphors',sub:'Use meaningful comparisons to communicate a feeling.',img:lessons.quatrain.img,scheme:'Simile & Metaphor',criteria:['Distinguish a simile from a metaphor.','Explain the shared quality between a feeling and an object.','Write original comparisons that communicate emotion.'],labels:[]};
function comparisonLesson(){const g=$('group').value;const steps=['WALT & SC','Inform','Practise','Independent task','Buddy Check'];const field=(id,label,placeholder='',multiline=false)=>`<div class="prompt"><label for="c_${id}">${label}</label>${multiline?`<textarea id="c_${id}" class="answer" data-save="comparison:${id}" placeholder="${placeholder}"></textarea>`:`<input id="c_${id}" data-save="comparison:${id}" placeholder="${placeholder}">`}</div>`;let content='';if(stage===0)content=`<div class="lessonhead"><strong>WALT:</strong> Use meaningful comparisons to communicate a feeling.<h3>Success Criteria</h3><p>I can distinguish a simile from a metaphor and explain the shared quality in my comparison.</p></div><h3>Which sentence helps you feel Tane's nerves?</h3><p><strong>A:</strong> When Tane walked into the hall for his speech, he felt very nervous.</p><p><strong>B:</strong> When Tane walked into the hall for his speech, his stomach was a washing machine on a spin cycle.</p>${field('hook','Why is Sentence B more powerful?','What can you picture or feel?',true)}<p>Challenge: move beyond clichés like “as brave as a lion.”</p>`;
if(stage===1)content=`<h3>Simile, metaphor and the shared quality</h3><div class="cards"><div class="task"><h3>Simile</h3><p>Compares using <strong>like</strong> or <strong>as</strong>.</p><p><em>Grief sat on her chest like a wet wool blanket.</em></p></div><div class="task"><h3>Metaphor</h3><p>States one thing <strong>is</strong> another.</p><p><em>Grief was a wet wool blanket suffocating her chest.</em></p></div></div><h3>The Golden Rule: Shared Quality</h3><p><strong>Grief / sadness → wet wool blanket → heavy, cold, suffocating and hard to lift off.</strong></p><p>The comparison must have a logical bridge. “His anger was a banana” doesn't communicate anger clearly without a meaningful shared quality.</p>${field('shared','Explain why the wet wool blanket comparison works.','Both grief and a wet wool blanket...',true)}`;
if(stage===2)content=`<h3>Step 1 · Spot the device</h3><p><em>“Jealousy is a green-eyed monster that feeds on your thoughts.”</em></p><div class="prompt"><label>Choose the device</label><select id="quiz1" data-save="comparison:quiz1"><option value="">Choose...</option><option value="simile">Simile</option><option value="metaphor">Metaphor</option></select></div><p><em>“Relief washed over him like cool water after a scorching summer run.”</em></p><div class="prompt"><label>Choose the device</label><select id="quiz2" data-save="comparison:quiz2"><option value="">Choose...</option><option value="simile">Simile</option><option value="metaphor">Metaphor</option></select></div><button class="btn alt" id="checkQuiz">Check my answers</button><div id="quizResult" aria-live="polite"></div><h3>Step 2 · Build one together</h3><p><strong>Feeling:</strong> overwhelming panic. <strong>Object:</strong> a rising king tide.</p><p><strong>Simile:</strong> Panic rose in his throat like a king tide swallowing the beach.</p><p><strong>Metaphor:</strong> Panic was a king tide swallowing his ability to think.</p><p><strong>Shared quality:</strong> both are relentless, overwhelming and can cut off escape.</p>${field('practice','Explain why the king tide is an effective comparison.','Both panic and a king tide...',true)}`;
if(stage===3)content=`<h3>Your Turn · Choose one feeling</h3><p>Sudden embarrassment · Quiet pride · Deep exhaustion</p><div class="prompt"><label for="c_feeling">My chosen feeling</label><select id="c_feeling" data-save="comparison:feeling"><option value="">Choose a feeling</option><option>Sudden embarrassment</option><option>Quiet pride</option><option>Deep exhaustion</option></select></div><p>Brainstorm <strong>two different concrete objects</strong>. Avoid clichés. For exhaustion, you might picture a phone battery blinking at 1%.</p><div class="cards"><div class="task">${field('object1','Object 1','Concrete object')}${field('quality1','Shared quality 1','What does it share with the feeling?',true)}</div><div class="task">${field('object2','Object 2','A different object')}${field('quality2','Shared quality 2','What does it share with the feeling?',true)}</div></div>${field('simile','My original simile (full descriptive sentence)','Use like or as...',true)}${field('explain1','Explain your simile','This comparison works because both...',true)}${field('metaphor','My original metaphor (full descriptive sentence)','State one thing is another...',true)}${field('explain2','Explain your metaphor','This comparison works because both...',true)}${g==='Storm'?'<p><strong>Storm extension:</strong> Revise your comparisons for originality and emotional precision. Explain which image has the stronger effect and why.</p>':''}${g==='Storm'?field('extension','My evaluation','Which is stronger, and why?',true):''}`;
if(stage===4)content=`<h3>Partner Check</h3><p>Swap books. Underline the <strong>simile once</strong> and the <strong>metaphor twice</strong>. Check that the simile uses “like” or “as”, the metaphor directly identifies one thing as another, and the shared-quality explanation makes logical sense.</p><div class="poem"><strong>Simile:</strong> ${esc(get('comparison:simile')||'Not written yet')}
<strong>Metaphor:</strong> ${esc(get('comparison:metaphor')||'Not written yet')}</div><label><input type="checkbox" data-save="comparison:check0"> We identified both devices correctly.</label><label><input type="checkbox" data-save="comparison:check1"> Both shared qualities make logical sense.</label><label><input type="checkbox" data-save="comparison:check2"> The comparisons communicate a feeling clearly.</label>${field('feedback','My partner’s feedback','What works well? What could improve?',true)}<p>Be ready to share your partner's best sentence.</p><button class="btn" id="finish">${done('comparison')?'✓ Lesson completed':'Mark lesson complete'}</button><div id="result"></div>`;

<div class="warrior-card"><h3>5. Partner Check</h3><p>Swap Humanities books with a partner and read each other's poems.</p><div class="prompt"><label><input type="checkbox" data-save="personification:check1"> I underlined the non-human thing once and circled the human action or quality.</label></div><div class="prompt"><label><input type="checkbox" data-save="personification:check2"> I checked that the explanation shows <strong>how</strong> the choice strengthens the feeling, not just “it sounds good”.</label></div>${input('feedback','Partner feedback','Which line works best, and why?')}<p><strong>Be ready to share your partner's best line with the class.</strong></p><button class="btn" data-complete="personification">Mark Lesson 2 complete</button></div>`;

function kindnessLimerickLesson(){
 const id='kindnessLimerick4';
 const input=(k,label,placeholder='',rows=2)=>`<div class="prompt"><label for="kl4_${k}">${label}</label><textarea id="kl4_${k}" rows="${rows}" data-save="${id}:${k}" placeholder="${placeholder}"></textarea></div>`;
 const check=(k,label)=>`<label class="kl4-check"><input type="checkbox" data-save="${id}:${k}"> ${label}</label>`;
 return `<div class="bulldogs-hero"><span class="bulldogs-kicker">${page==='lesson1'?'Lesson 1':'Lesson 4'} · All groups</span><h2>A Kindness Limerick</h2><p>Write a playful, five-line poem with a bouncy rhythm and a kind message.</p></div>
 <div class="warrior-goal"><div><strong>WALT</strong><p>Write a playful limerick about kindness.</p></div><div><strong>Success Criteria</strong><ul><li>Five lines with an <strong>AABBA</strong> rhyme scheme</li><li>Longer and shorter lines used appropriately</li><li>A kind, light-hearted tone</li></ul></div></div>
 <nav class="kl4-nav" aria-label="Lesson 4 sections"><a href="#kl4-listen">1. Listen and Notice</a><a href="#kl4-plan">2. Plan</a><a href="#kl4-write">3. Write</a><a href="#kl4-partner">4. Partner Check</a><a href="#kl4-exit">5. Exit Ticket</a></nav>
 <section class="warrior-card" id="kl4-listen"><h3>1. Listen and Notice</h3><p>Read this limerick aloud. Listen to its playful, bouncy rhythm.</p><div class="kl4-poem"><div>There once was a bench in the <strong>street,</strong> <b>A</b></div><div>That welcomed all tired young <strong>feet.</strong> <b>A</b></div><div>When someone felt <strong>low,</strong> <b>B</b></div><div>It gave a warm <strong>glow,</strong> <b>B</b></div><div>And turned a sad day to a <strong>treat!</strong> <b>A</b></div></div><div class="grid2"><div class="bulldogs-choice"><h4>Rhyme: AABBA</h4><p>Lines <strong>1, 2 and 5</strong> rhyme: street / feet / treat.</p><p>Lines <strong>3 and 4</strong> rhyme: low / glow.</p></div><div class="bulldogs-choice"><h4>Rhythm: Hear the bounce</h4><p>Lines <strong>1, 2 and 5</strong> are longer.</p><p>Lines <strong>3 and 4</strong> are shorter and snappier. Read aloud instead of worrying about exact syllable counts.</p></div></div>${input('notice','What do you notice about the poem?','I noticed…')}</section>
 <section class="warrior-card" id="kl4-plan"><h3>2. Plan a Kind Moment</h3><p>Think of a small, light-hearted act of kindness. Who is involved? What happens?</p><div class="warrior-bank"><strong>Ideas to get started</strong><div class="warrior-chips"><span>Sharing a snack</span><span>Finding a lost shoe</span><span>Cheering up a friend in the rain</span><span>Holding a door for a busy teacher</span></div></div>${input('idea','My kind moment','Who is involved? What happens?',3)}<div class="grid2">${input('rhymeA','Rhyme family A · lines 1, 2 and 5','Three words with the same ending sound')}${input('rhymeB','Rhyme family B · lines 3 and 4','Two words with a different ending sound')}</div></section>
 <section class="warrior-card" id="kl4-write"><h3>3. Write Your Five-Line Limerick</h3><p>Write your poem in your Humanities book, or type it here to save it on this device.</p><div class="kl4-lines">${[['1','A','Long','Introduce your character or place'],['2','A','Long','Add a detail that rhymes with line 1'],['3','B','Short','Start the action or problem'],['4','B','Short','Finish the action; rhyme with line 3'],['5','A','Long','End with kindness; rhyme with lines 1 and 2']].map(([n,r,len,help])=>`<div class="kl4-line"><div><strong>Line ${n}</strong><span class="kl4-rhyme">${r}</span><small>${len} · ${help}</small></div><textarea rows="2" aria-label="Poem line ${n}" data-save="${id}:line${n}" placeholder="Write line ${n} here…"></textarea></div>`).join('')}</div></section>
 <section class="warrior-card" id="kl4-partner"><h3>4. Partner Check</h3><p>Swap poems and <strong>read them aloud</strong> to each other. Check the three things below.</p><div class="kl4-checks">${check('checkRhyme','Rhyme: the end words follow AABBA.')}${check('checkRhythm','Rhythm: the poem sounds smooth and bouncy; awkward words have been improved.')}${check('checkMeaning','Meaning: the poem tells a clear, kind story.')}</div>${input('partnerFeedback','A helpful comment from my partner','One thing that works well… One thing to improve…')}</section>
 <section class="warrior-card" id="kl4-exit"><h3>5. Exit Ticket</h3><p>Complete these final checks in your book, then record them below.</p><div class="kl4-checks">${check('checkLabels','I labelled the ends of my five lines A, A, B, B, A.')}${check('checkUnderline','I underlined the line with the smoothest, bounciest rhythm.')}</div>${input('bestLine','My smoothest, bounciest line','Copy your best line here…') }<div class="bulldogs-actions"><button class="btn" id="kl4Finish" type="button">Mark Lesson 4 complete</button><button class="btn alt" data-go="progress" type="button">View My Progress</button></div><div id="kl4Result" aria-live="polite"></div></section>`;
}
function bulldogsPersonificationLesson(){
const pref='bulldogsPersonification:';
const text=(key,label,placeholder='',rows=2)=>`<div class="prompt"><label for="bp_${key}">${label}</label><textarea id="bp_${key}" rows="${rows}" data-save="${pref+key}" placeholder="${placeholder}"></textarea></div>`;
const select=(key,label,opts)=>`<div class="prompt"><label for="bp_${key}">${label}</label><select id="bp_${key}" data-save="${pref+key}"><option value="">Choose one…</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
return `<div class="bulldogs-hero"><span class="bulldogs-kicker">Bulldogs · Lesson 3</span><h2>Personification: Make Your Poem Feel Stronger</h2><p>Give something non-human a human action to help your reader feel an emotion.</p></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">1</span><div><h3>WALT &amp; Success Criteria</h3><p>Know what you are learning before you begin.</p></div></div><div class="bulldogs-two"><div class="bulldogs-choice"><h4>WALT</h4><p>Use personification to strengthen a poem’s feeling.</p></div><div class="bulldogs-choice"><h4>Success Criteria</h4><p>I can give something non-human a human action or quality, and tell how it makes the reader feel.</p></div></div></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">2</span><div><h3>Read &amp; Look</h3><p>Read both poems. Which one helps you feel scared?</p></div></div><div class="bulldogs-two"><div class="bulldogs-choice"><h4>Poem 1</h4><p>The wind blew on the window.<br>The trees moved in the dark.<br>I felt scared.</p></div><div class="bulldogs-choice"><h4>Poem 2</h4><p>The wind <strong>scratched</strong> at the window.<br>The trees <strong>whispered</strong> secrets in the dark.</p></div></div><div class="bulldogs-model" style="margin-top:15px"><strong>Notice:</strong> Poem 2 never says “scared,” but it feels spooky because the wind <strong>scratches</strong> and the trees <strong>whisper</strong> — actions people can do.</div><p><strong>Personification</strong> (per-son-if-ih-kay-shun) means giving something non-human a human action or feeling.</p></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">3</span><div><h3>How Personification Works</h3><p>Choose a human action that matches the feeling you want to create.</p></div></div><div class="bp-table-wrap"><table class="bp-table"><thead><tr><th>Feeling</th><th>Personification sentence</th><th>Thing + human action</th><th>Effect on the reader</th></tr></thead><tbody><tr><td><strong>Scared</strong></td><td>The old door <strong>groaned</strong> and <strong>refused</strong> to open.</td><td>Door + groaned / refused</td><td>Grumpy, creepy, scary</td></tr><tr><td><strong>Happy</strong></td><td>The front door <strong>welcomed</strong> us inside with a warm hug.</td><td>Door + welcomed / hugged</td><td>Friendly, safe, happy</td></tr></tbody></table></div><div class="bulldogs-model" style="margin-top:15px"><strong>Remember:</strong> Match the action to the feeling! For a happy poem, make the sun <strong>smile</strong> or <strong>dance</strong>, not glare angrily.</div></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">4</span><div><h3>Try It Yourself!</h3><p>Answer all three questions before revealing the answers.</p></div></div><div class="bulldogs-choice"><p><strong>1.</strong> “The sun <strong>smiled</strong> down on the playground.”</p>${text('q1','What is the non-human thing, and what human action does it do?','Non-human thing: …  Human action: …')}</div><div class="bulldogs-choice" style="margin-top:12px"><p><strong>2.</strong> “My heavy schoolbag <strong>sighed</strong> as I dropped it on the floor.”</p>${text('q2','What is the non-human thing, and what human action does it do?','Non-human thing: …  Human action: …')}</div><div class="bulldogs-choice" style="margin-top:12px"><p><strong>3.</strong> How does sentence 2 make the reader feel?</p>${select('q3','Choose the best answer',['Excited','Tired','Angry'])}</div><div class="bulldogs-actions"><button class="btn alt" id="bpReveal" type="button">Check my answers</button></div><div id="bpAnswers" aria-live="polite"></div></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">5</span><div><h3>Your Turn to Write</h3><p>Choose one feeling and two non-human things. Complete your work in your writing book or type it here.</p></div></div><div class="bulldogs-two"><div class="bulldogs-choice"><h4>Box A · Pick 1 feeling</h4>${select('feeling','My feeling',['Happy','Scared','Tired'])}</div><div class="bulldogs-choice"><h4>Box B · Pick 2 things</h4>${select('thing1','First non-human thing',['The wind','The sun','My shoes','The clouds','A tree'])}${select('thing2','Second non-human thing',['The wind','The sun','My shoes','The clouds','A tree'])}</div></div><h4 style="margin-top:24px">Step 1 · Plan it</h4><p>Match each non-human thing with a human action that fits your feeling.</p><div class="bulldogs-model"><strong>Human Action Word Bank:</strong> danced · smiled · cheered · crept · whispered · shivered · yawned · slumped · dragged its feet</div><div class="bulldogs-two">${text('action1','Human action for your first thing','e.g. whispered')}${text('action2','Human action for your second thing','e.g. shivered')}</div><h4>Step 2 · Write a 2-Line Poem</h4><div class="bulldogs-model"><em>The [first non-human thing] [first human action],<br>And the [second non-human thing] [second human action].</em></div>${text('poem','My two-line poem','The …\nAnd the …',4)}<h4>Step 3 · Explain the Effect</h4><div class="bulldogs-model"><em>I gave the [non-human thing] a human action to make the reader feel __________.</em></div>${text('effect','My explanation','I gave the … a human action to make the reader feel …',3)}<div class="bulldogs-actions"><button class="btn" id="bpFinish" type="button">Mark Lesson 3 complete</button><button class="btn alt" data-go="progress" type="button">View My Progress</button></div><div id="bpResult" aria-live="polite"></div></div>`;
}
function warriorsPersonificationLesson(){
 const id='warriorsPersonification';
 const field=(k,label,placeholder='',rows=2)=>`<div class="prompt"><label for="wp_${k}">${label}</label><textarea id="wp_${k}" rows="${rows}" data-save="${id}:${k}" placeholder="${placeholder}"></textarea></div>`;
 const select=(k,label,items)=>`<div class="prompt"><label for="wp_${k}">${label}</label><select id="wp_${k}" data-save="${id}:${k}"><option value="">Choose one…</option>${items.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
 const check=(k,label)=>`<label class="kl4-check"><input type="checkbox" data-save="${id}:${k}"> ${label}</label>`;
 return `<div class="bulldogs-hero"><span class="bulldogs-kicker">Warriors · Lesson 3</span><h2>Personification</h2><p>Give non-human things purposeful human actions to create a clear feeling in poetry.</p></div>
 <div class="warrior-goal"><div><strong>WALT</strong><p>Use personification to strengthen a poem’s feeling.</p></div><div><strong>Success Criteria</strong><p>I can give something non-human a human action or quality and explain its effect.</p></div></div>
 <nav class="kl4-nav" aria-label="Warriors personification sections"><a href="#wp-hook">1. WALT &amp; SC</a><a href="#wp-inform">2. Inform</a><a href="#wp-practise">3. Practise</a><a href="#wp-write">4. Independent Task</a><a href="#wp-check">5. Buddy Check</a></nav>
 <section class="warrior-card" id="wp-hook"><h3>1. Hook &amp; Our Goal</h3><p>Read both extracts. Which makes you feel the fear without naming it?</p><div class="grid2"><div class="bulldogs-choice"><h4>Extract A</h4><p><em>The wind blew against the house. The trees moved in the dark. I felt scared inside my room.</em></p></div><div class="bulldogs-choice"><h4>Extract B</h4><p><em>The wind <strong>scratched</strong> at the bedroom window, while the trees <strong>huddled</strong> together and <strong>whispered</strong> warnings in the dark.</em></p></div></div><p><strong>Notice:</strong> Extract B creates a spooky mood without using “scared”. The wind and trees act like nervous or threatening people.</p>${field('hook','Why is Extract B more effective?','The words scratched and whispered make the reader feel…',3)}</section>
 <section class="warrior-card" id="wp-inform"><h3>2. How Personification Works</h3><p><strong>Personification</strong> gives a non-human object, place or weather element a human action, feeling or trait.</p><div class="warrior-bank"><strong>Golden Rule: Match the Feeling</strong><p>Choose human actions that create the mood you want. Changing the action can completely change the feeling.</p></div><div class="bp-table-wrap"><table class="bp-table"><thead><tr><th>Target feeling</th><th>Personified line</th><th>Thing + human action</th><th>Effect on the reader</th></tr></thead><tbody><tr><td>Fear / creepiness</td><td>The front door <strong>groaned</strong> and <strong>refused</strong> to open.</td><td>Door + groaned / refused</td><td>The house feels grumpy, trapping and scary.</td></tr><tr><td>Warmth / welcome</td><td>The front door <strong>opened its arms</strong> to greet us after the storm.</td><td>Door + opened its arms / greeted</td><td>The house feels friendly, safe and comforting.</td></tr></tbody></table></div><p><strong>Explaining the effect:</strong> Don't just say “It makes the poem better.” Name the feeling and explain how the action helps the reader picture it.</p></section>
 <section class="warrior-card" id="wp-practise"><h3>3. Let’s Practise Together</h3><p>For each line, identify the <strong>non-human thing</strong>, its <strong>human action or quality</strong>, and the <strong>feeling</strong> it creates.</p><div class="bulldogs-choice"><h4>Line 1</h4><p><em>The empty classroom <strong>held its breath</strong> as the test papers landed on the desks.</em></p>${field('practice1','What is personified, and what effect does it create?','The classroom held its breath, making the reader feel…')}</div><div class="bulldogs-choice"><h4>Line 2</h4><p><em>A brave ray of sunlight <strong>pushed</strong> its way through the grey clouds.</em></p>${field('practice2','What is personified, and what effect does it create?','The sunlight is given… This creates…')}</div><button class="btn alt" id="wpReveal" type="button">Check the example answers</button><div id="wpAnswers" aria-live="polite"></div><h4>Build One Together: Exhaustion</h4><p>Imagine being completely exhausted after a long day. Give a schoolbag and clock slow, tired human actions.</p><div class="kl4-poem"><div>My schoolbag <strong>slumped</strong> tiredly against the wall,</div><div>While the bedroom clock <strong>dragged</strong> its heavy hands toward bedtime.</div></div><p>These actions make time feel sluggish and show how worn out the writer is.</p></section>
 <section class="warrior-card" id="wp-write"><h3>4. Your Turn to Write</h3><p>Open your Humanities book. Choose <strong>one feeling</strong>, then pair <strong>two non-human things</strong> with matching human actions. You can also save your work below.</p><div class="grid2"><div class="bulldogs-choice"><h4>List A · Pick 1 Feeling</h4>${select('feeling','My target feeling',['Loneliness','Panic / Fear','Excitement'])}</div><div class="bulldogs-choice"><h4>List B · Idea Bank</h4><p><strong>Objects:</strong> the clock, the wind, my shoes, the shadows, the school gate, the sun.</p><p><strong>Lonely:</strong> waited, turned its back, sighed, watched silently.</p><p><strong>Panic:</strong> raced, screamed, cornered, pounded.</p><p><strong>Excited:</strong> danced, cheered, leaped, beamed.</p></div></div><h4>Step 1 · Plan</h4><p>Choose two non-human things and give each a human action that matches your feeling.</p><div class="grid2">${field('thing1','Non-human thing 1','e.g. the clock')}${field('action1','Matching human action 1','e.g. screamed')}${field('thing2','Non-human thing 2','e.g. the shadows')}${field('action2','Matching human action 2','e.g. cornered')}</div><h4>Step 2 · Draft Your Poem</h4><p>Write <strong>3–4 lines</strong>. Show the feeling <strong>without naming it directly</strong>. Use at least one clear example of personification; aim for two as a challenge.</p>${field('poem','My 3–4 line poem','Write each line on a new line…',5)}<h4>Step 3 · Explain the Effect</h4><div class="bulldogs-model">I personified [non-human thing] by giving it the human action of [action]. The effect of this is to make the reader feel [feeling] because…</div>${field('effect','My explanation','I personified… The effect is… because…',3)}</section>
 <section class="warrior-card" id="wp-check"><h3>5. Partner Check</h3><p>Swap Humanities books with a partner. Underline the <strong>non-human thing</strong> once and circle its <strong>human action</strong>. Check the explanation names the feeling and shows <strong>how</strong> the action creates it.</p><div class="kl4-checks">${check('check1','I underlined the non-human thing and circled the human action.')}${check('check2','I checked that the explanation clearly describes the effect on the reader.')}</div>${field('feedback','My partner’s feedback','Which line creates the strongest feeling, and why?',3)}<p>Be ready to share your partner’s best line.</p><div class="bulldogs-actions"><button class="btn" type="button" id="wpFinish">${done(id)?'Lesson completed · Review':'Mark Lesson 3 complete'}</button><button class="btn alt" type="button" data-go="progress">View My Progress</button></div><div id="wpResult" aria-live="polite"></div></section>`;

function bulldogsLesson(){
const prefix='bulldogsFollowup:';
const input=(id,label,placeholder)=>`<div class="prompt"><label for="bd_${id}">${label}</label><textarea class="answer" id="bd_${id}" data-save="${prefix+id}" placeholder="${placeholder}"></textarea></div>`;
const options=(id,items,caption)=>`<div class="prompt"><label for="bd_${id}">${caption}</label><select id="bd_${id}" data-save="${prefix+id}"><option value="">Choose an option</option>${items.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`;
const feelings=['Happy','Angry','Tired'];const things=['A melting ice block','A bouncing ball','A roaring lion','A flat balloon','A sunny day'];
return `<div class="bulldogs-hero"><span class="bulldogs-kicker">Bulldogs · Lesson 2</span><h2>Similes and Metaphors</h2><p>Choose <strong>1 feeling</strong> and <strong>2 real things</strong>. Use them to write a simile and a metaphor.</p></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">1</span><div><h3>Make your choices</h3><p>Pick one feeling from Box A and two real things from Box B.</p></div></div><div class="bulldogs-two"><div class="bulldogs-choice"><h4>Box A · Pick 1 Feeling</h4>${options('feeling',feelings,'My feeling')}</div><div class="bulldogs-choice"><h4>Box B · Pick 2 Real Things</h4>${options('object1',things,'My first real thing')}${options('object2',things,'My second real thing')}</div></div></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">2</span><div><h3>Plan it</h3><p>Think about how your feeling and each real thing are the same. You can also copy the table into your writing book.</p></div></div><div class="bulldogs-table"><div class="bulldogs-tablehead">Feeling</div><div class="bulldogs-tablehead">Real thing</div><div class="bulldogs-tablehead">How are they the same?</div><div class="bulldogs-tablevalue" id="bdPlanFeeling1">Your feeling</div><div class="bulldogs-tablevalue" id="bdPlanObject1">First choice</div><div>${input('quality1','Choice 1 · Shared quality','They are both...')}</div><div class="bulldogs-tablevalue" id="bdPlanFeeling2">Your feeling</div><div class="bulldogs-tablevalue" id="bdPlanObject2">Second choice</div><div>${input('quality2','Choice 2 · Shared quality','They are both...')}</div></div></div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">3</span><div><h3>Write a Simile</h3><p>Use your <strong>first</strong> real thing. A simile uses <strong>like</strong> or <strong>as</strong>.</p></div></div><div class="bulldogs-model">Feeling <em>[your feeling]</em> is <strong>like</strong> <em>[your first real thing]</em>.</div>${input('simile','My simile','Feeling happy is like ...')}</div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">4</span><div><h3>Write a Metaphor</h3><p>Use your <strong>second</strong> real thing. A metaphor says one thing <strong>is</strong> another.</p></div></div><div class="bulldogs-model">Feeling <em>[your feeling]</em> <strong>is</strong> <em>[your second real thing]</em>.</div>${input('metaphor','My metaphor','Feeling happy is ...')}</div>
<div class="bulldogs-card"><div class="bulldogs-heading"><span class="bulldogs-step">5</span><div><h3>Explain Why</h3><p>Tell your reader what the feeling and real thing have in common.</p></div></div><div class="bulldogs-model">They are the same because both are <em>____________</em>.</div>${input('explain','My explanation','They are the same because both are ...')}<div class="bulldogs-actions"><button class="btn" id="finish">${done('bulldogsFollowup')?'Lesson completed · Review':'Mark task complete'}</button><button class="btn alt" data-go="progress">View My Progress</button></div><div id="result" aria-live="polite"></div></div>`;
}
function warriorsLesson(){
const steps=['Read & Compare','Learn the Rules','Self-Check','Your Turn','Final Self-Assessment'];
const f=(id,label,placeholder='')=>`<div class="prompt"><label for="w_${id}">${label}</label><textarea class="answer" id="w_${id}" data-save="warriorsComparison:${id}" placeholder="${placeholder}"></textarea></div>`;
let content='';
if(stage===0)content=`<div class="warrior-card"><div class="warrior-card-title"><span class="warrior-number">01</span><div><h3>Read & Compare</h3><p>Read the two examples and notice what changes.</p></div></div><div class="warrior-examples"><div class="warrior-example"><span class="warrior-example-label">Sentence A · Telling</span><p> When Tane walked into the hall for his speech, he felt very nervous.</p></div><div class="warrior-example"><span class="warrior-example-label">Sentence B · Showing</span><p> When Tane walked into the hall for his speech, his stomach was a washing machine.</p></div></div><div class="warrior-tip">Both tell us Tane is nervous. Sentence B helps us picture and feel what is happening inside him by comparing his stomach to a spinning washing machine.</div>${f('read','How does Sentence B help you picture Tane’s feelings?')}</div>`;
if(stage===1)content=`<div class="warrior-card"><div class="warrior-card-title"><span class="warrior-number">02</span><div><h3>Learn the Rules</h3><p>Understand two different ways to compare feelings.</p></div></div><p>A feeling is invisible. Compare it to a real object that readers can see, hear or touch.</p><table><thead><tr><th>Type</th><th>How to spot it</th><th>Example</th></tr></thead><tbody><tr><td><strong>Simile</strong></td><td>Uses <strong>like</strong> or <strong>as</strong></td><td>Sadness felt <strong>like</strong> a heavy backpack on her shoulders.</td></tr><tr><td><strong>Metaphor</strong></td><td>Says one thing <strong>is</strong> or <strong>was</strong> another</td><td>Sadness <strong>was</strong> a heavy backpack on her shoulders.</td></tr></tbody></table><h3>The Golden Rule: Shared Quality</h3><table><thead><tr><th>Feeling</th><th>Real Object</th><th>Shared Quality</th></tr></thead><tbody><tr><td>Sadness</td><td>A heavy backpack</td><td>Both weigh you down, make movement difficult and are tiring to carry.</td></tr></tbody></table><p>A comparison needs a sensible connection. “His anger was a banana” is confusing because the shared quality is unclear.</p>${f('rule','Explain what a shared quality is in your own words.')}</div>`;
if(stage===2)content=`<div class="warrior-card"><div class="warrior-card-title"><span class="warrior-number">03</span><div><h3>Self-Check Practice</h3><p>Test what you know before checking the answers.</p></div></div><p>Answer all three questions before revealing the answer key.</p><div class="prompt"><label for="wq1">1. “Anger is an erupting volcano inside his chest.”</label><select id="wq1" data-save="warriorsComparison:wq1"><option value="">Choose an answer</option><option>Simile</option><option>Metaphor</option></select></div><div class="prompt"><label for="wq2">2. “Happiness bubbled up inside her like fizzy lemonade.”</label><select id="wq2" data-save="warriorsComparison:wq2"><option value="">Choose an answer</option><option>Simile</option><option>Metaphor</option></select></div>${f('practice','3. Comparing anger to an erupting volcano works because both...')}<button class="btn" id="warriorReveal" type="button">Check your answers</button><div id="warriorAnswers" aria-live="polite"></div></div>`;
if(stage===3)content=`<div class="warrior-card"><div class="warrior-card-title"><span class="warrior-number">04</span><div><h3>Your Turn to Write</h3><p>Plan two comparisons, then write and explain them.</p></div></div><p>Choose <strong>one feeling</strong>: excitement, anger or tiredness. Choose <strong>two different objects</strong> from the idea bank or your own ideas.</p><div class="warrior-bank"><strong>Object idea bank</strong><div class="warrior-chips"><span>A flat tyre</span><span>Fireworks in the sky</span><span>A boiling pot of water</span><span>A dying phone battery</span><span>A bouncing basketball</span></div></div><h4 class="warrior-subheading">Step 1 · Plan your ideas</h4><p class="warrior-muted">Choose one feeling and two different objects. Explain what they have in common.</p><div class="warrior-fields">${f('feeling','My chosen feeling')}${f('object1','Object 1')}${f('quality1','Shared quality for object 1')}${f('object2','Object 2')}${f('quality2','Shared quality for object 2')}</div><h4 class="warrior-subheading">Step 2 · Write and explain</h4><p class="warrior-muted">Use <strong>like</strong> or <strong>as</strong> in your simile, but not in your metaphor.</p><div class="warrior-fields">${f('simile','1. My simile (use like or as)')}${f('explain1','Why it works: “This comparison works because both…”')}${f('metaphor','2. My metaphor (direct comparison; no like or as)')}${f('explain2','Why it works: “This comparison works because both…”')}</div></div>`;
if(stage===4)content=`<div class="warrior-card"><div class="warrior-card-title"><span class="warrior-number">05</span><div><h3>Final Self-Assessment</h3><p>Check your work and reflect on your learning.</p></div></div><p>Tick each statement only after checking your work.</p><div class="criteria"><label><input type="checkbox" class="warriorCheck" data-save="warriorsComparison:check0"> I can identify a simile and a metaphor.</label><label><input type="checkbox" class="warriorCheck" data-save="warriorsComparison:check1"> My simile uses like or as.</label><label><input type="checkbox" class="warriorCheck" data-save="warriorsComparison:check2"> My metaphor compares two things directly without like or as.</label><label><input type="checkbox" class="warriorCheck" data-save="warriorsComparison:check3"> I used two objects for one feeling.</label><label><input type="checkbox" class="warriorCheck" data-save="warriorsComparison:check4"> I explained the shared quality for both comparisons.</label></div>${f('reflection','What is one thing you improved or learned?')}<button class="btn" id="finish">Mark lesson complete</button><div id="result" aria-live="polite"></div></div>`;
return `<div class="stages warrior-stages">${steps.map((x,i)=>`<button type="button" data-stage="${i}" class="${i===stage?'active':''}">${x}</button>`).join('')}</div><div class="warrior-header"><span class="warrior-eyebrow">Independent learning · English</span><h2>Meaningful Comparisons</h2><p>Warriors · Room ${$('room').value.replace('Room ','')} · 40 minutes</p></div><div class="warrior-goal"><div><strong>WALT</strong><p>Use meaningful comparisons to communicate a feeling.</p></div><div><strong>Success Criteria</strong><p>I can distinguish a simile from a metaphor and explain the shared quality in my comparison.</p></div></div>${content}<div class="stage-actions">${stage>0?'<button class="btn secondary" id="back">Previous</button>':''}${stage<4?'<button class="btn" id="next">Next step</button>':''}</div>`;
}
function lesson(id){if(id==='bulldogsFollowup')return bulldogsLesson();if(id==='warriorsComparison')return warriorsLesson();if(id==='comparison')return comparisonLesson();const l=lessons[id],g=$('group').value,parts=['Learn','Explore','Plan','Write','Review'];let content='';if(stage===0){content=`<div class="lessonhead"><strong>IAMT (I am learning to):</strong> ${esc(l.sub)}<h3>Success Criteria</h3><ul class="criteria">${l.criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><p class="small">${id==='limerick'?'Lines 1, 2 and 5 are longer (often three beats). Lines 3 and 4 are shorter (often two beats). Read aloud to hear the rhythm.':'A quatrain has four lines. In ABAB, lines 1 and 3 rhyme; lines 2 and 4 rhyme.'}</p>`}if(stage===1){content=`<h3>Read and notice</h3><div class="poem">${esc(l.poem)}</div><div class="prompt"><label for="notice">What do you notice about the rhyme, rhythm or message?</label><textarea class="answer" id="notice" data-save="${id}:notice" placeholder="Write your observation..."></textarea></div><p class="small muted">${id==='limerick'?'Listen for the bounce. End words: bus, fuss, cheer, here, us.':'End words: chair, smile, care, worthwhile. Can you spot ABAB?'}</p>`}if(stage===2){content=`<h3>Your ${esc(g)} writing guide</h3><ol class="criteria">${guide[g][id].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="prompt"><label for="idea">My idea or message</label><textarea id="idea" class="answer" data-save="${id}:idea" placeholder="Plan your act of kindness or compassionate message..."></textarea></div><div class="prompt"><label for="rhymes">My rhyme bank (A and B words)</label><textarea id="rhymes" class="answer" data-save="${id}:rhymes" placeholder="A: ...   B: ..."></textarea></div>`}if(stage===3){content=`<h3>Write your poem</h3><p class="muted">${id==='limerick'?'Five lines · AABBA · longer, longer, shorter, shorter, longer':'Four lines · ABAB · one clear message'}</p>${l.labels.map((label,i)=>`<div class="prompt"><label for="line${i}">Line ${i+1} (${label})</label><input type="text" id="line${i}" data-save="${id}:line${i}" placeholder="Write line ${i+1} here..."></div>`).join('')}<button class="btn alt" id="copyPoem">Copy my poem</button>`}if(stage===4){content=`<h3>Read-aloud and reflection</h3><p>${esc(l.end)}</p><div class="poem" id="reviewPoem">${l.labels.map((x,i)=>esc(get(`${id}:line${i}`)||`Line ${i+1} not written yet`)).join('\n')}</div><div class="prompt"><label for="reflect">My reflection or exit ticket</label><textarea id="reflect" class="answer" data-save="${id}:reflect" placeholder="Explain your rhyme pattern and what you improved..."></textarea></div><div class="prompt"><label><input type="checkbox" id="checkRhyme" data-save="${id}:check0"> I checked my rhyme pattern.</label><label><input type="checkbox" id="checkRead" data-save="${id}:check1"> I read my poem aloud.</label><label><input type="checkbox" id="checkMeaning" data-save="${id}:check2"> My poem communicates kindness or compassion.</label></div><button class="btn" id="finish">${done(id)?'✓ Lesson completed':'Mark lesson complete'}</button><div id="result"></div>`}return `<div class="intro"><img class="cover" src="${l.img}" alt="Original lesson slide"><div>${header(l.title,l.sub)}<span class="tag">${esc(levels[g])}</span></div></div><div class="steps">${parts.map((x,i)=>`<button class="step ${i===stage?'active':''}" data-stage="${i}">${i+1}. ${x}</button>`).join('')}</div>${content}<div class="row" style="margin-top:17px"><button class="btn ghost" id="back" ${stage===0?'disabled':''}>← Previous</button><button class="btn" id="next" ${stage===4?'disabled':''}>Next step →</button></div>`}

function render(){$('level').textContent=isRoom22()?'Phase 3.4+':levels[$('group').value];updateRoster();$('content').innerHTML=page==='home'?home():page==='progress'?progress():page==='lesson1'?(isRoom22()?lesson('comparison'):kindnessLimerickLesson()):/^lesson[2-5]$/.test(page)?(advancedGroup()&&page==='lesson2'?lesson('comparison'):advancedGroup()&&page==='lesson3'?personificationLesson():page==='lesson2'&&!isRoom22()&&$('group').value==='Bulldogs'?bulldogsLesson():page==='lesson2'&&!isRoom22()&&$('group').value==='Warriors'?warriorsLesson():page==='lesson3'&&!isRoom22()&&$('group').value==='Bulldogs'?bulldogsPersonificationLesson():page==='lesson3'&&!isRoom22()&&$('group').value==='Warriors'?warriorsPersonificationLesson():page==='lesson4'&&isRoom22()?kindnessLimerickLesson():pendingLesson()):lesson(page);if(page!=='home'&&page!=='progress'&&hasIdentity())$('content').insertAdjacentHTML('afterbegin','<p class="save-status" role="status">Answers save automatically on this device.</p>');document.querySelectorAll('[data-save]').forEach(el=>{if(el.type==='checkbox')el.checked=get(el.dataset.save)==='yes';else el.value=get(el.dataset.save);const store=()=>{save(el.dataset.save,el.type==='checkbox'?(el.checked?'yes':''):el.value);};el.addEventListener('input',store);el.addEventListener('change',()=>{store();if(page==='bulldogsFollowup'||(page==='lesson1'&&currentLessonOne()==='bulldogsFollowup'))updateBulldogsPlan()})});if(page==='bulldogsFollowup'||(page==='lesson1'&&currentLessonOne()==='bulldogsFollowup'))updateBulldogsPlan();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);render()});if($('back'))$('back').onclick=()=>{stage=Math.max(0,stage-1);render()};if($('next'))$('next').onclick=()=>{stage=Math.min(4,stage+1);render()};if($('kl4Finish'))$('kl4Finish').onclick=()=>{const needed=['idea','rhymeA','rhymeB','line1','line2','line3','line4','line5'];if(needed.some(k=>!get('kindnessLimerick4:'+k).trim())){$('kl4Result').innerHTML='<div class="feedback warn">Finish your plan, rhyme banks and five poem lines before marking Lesson 4 complete.</div>';return;}save('done:kindnessLimerick4','yes');$('kl4Result').innerHTML='<div class="feedback">Lesson 4 complete! Your poem and checks are saved on this device.</div>';};if($('wpReveal'))$('wpReveal').onclick=()=>{$('wpAnswers').innerHTML='<div class="feedback"><strong>Check your thinking</strong><p><strong>Line 1:</strong> The classroom holds its breath. This makes the silence feel heavy, nervous and tense.</p><p><strong>Line 2:</strong> The sunlight is brave and pushes through the clouds. This creates hope and cheerfulness.</p></div>'};if($('wpFinish'))$('wpFinish').onclick=()=>{const required=['feeling','thing1','action1','thing2','action2','poem','effect'];if(required.some(k=>!get('warriorsPersonification:'+k).trim())){$('wpResult').innerHTML='<div class="feedback warn">Complete your feeling, plan, poem and explanation before finishing.</div>';return;}save('done:warriorsPersonification','yes');$('wpResult').innerHTML='<div class="feedback">Lesson 3 complete! Your answers are saved on this device.</div>';};if($('bpReveal'))$('bpReveal').onclick=()=>{$('bpAnswers').innerHTML='<div class="feedback"><strong>Answer key</strong><p><strong>1.</strong> The sun + smiled.</p><p><strong>2.</strong> My schoolbag + sighed.</p><p><strong>3.</strong> Tired — people sigh when they feel worn out.</p></div>'};if($('bpFinish'))$('bpFinish').onclick=()=>{const fields=['feeling','thing1','thing2','action1','action2','poem','effect'];if(fields.some(f=>!get('bulldogsPersonification:'+f).trim())){$('bpResult').innerHTML='<div class="feedback warn">Finish your choices, actions, poem and explanation before marking the lesson complete.</div>';return;}save('done:bulldogsPersonification','yes');$('bpResult').innerHTML='<div class="feedback">Lesson 3 complete! Your work is saved on this device.</div>';};if($('warriorReveal'))$('warriorReveal').onclick=()=>{$('warriorAnswers').innerHTML='<div class="feedback"><strong>Answer key:</strong><p>1. Metaphor — anger <em>is</em> a volcano.</p><p>2. Simile — happiness is compared using <em>like</em>.</p><p>3. Both build up pressure and burst out (heat, pressure or bursting are all reasonable explanations).</p></div>'};if($('checkQuiz'))$('checkQuiz').onclick=()=>{$('quizResult').innerHTML= $('quiz1').value==='metaphor'&&$('quiz2').value==='simile'?'<div class="feedback">Correct! Jealousy is a metaphor; relief is a simile. Both comparisons connect a feeling to an object through a shared quality.</div>':'<div class="feedback warn">Try again: look for “like” or “as” in a simile, and a direct comparison in a metaphor.</div>'};if($('finish'))$('finish').onclick=()=>{const l=lessons[page];if(page==='bulldogsFollowup'){const needed=['feeling','object1','quality1','object2','quality2','simile','metaphor','explain'];if(needed.some(x=>!get('bulldogsFollowup:'+x).trim())){$('result').innerHTML='<div class="feedback warn">Complete both rows of your plan, your simile, metaphor and explanation first.</div>';return}}else if(page==='warriorsComparison'){const needed=['feeling','object1','quality1','object2','quality2','simile','metaphor','explain1','explain2'];if(needed.some(x=>!get('warriorsComparison:'+x).trim())){$('result').innerHTML='<div class="feedback warn">Please complete your plan, both comparisons and explanations first.</div>';return}}else if(page==='comparison'){const needed=['object1','quality1','object2','quality2','simile','metaphor','explain1','explain2'];if(needed.some(x=>!get('comparison:'+x).trim())){$('result').innerHTML='<div class="feedback warn">Complete your two comparisons and shared-quality explanations first.</div>';return}}else if(l.labels.some((_,i)=>!get(`${page}:line${i}`).trim())){$('result').innerHTML='<div class="feedback warn">Please write all of your poem lines before completing the lesson.</div>';return}save('done:'+page,'yes');$('result').innerHTML='<div class="feedback">Great work! Your lesson is marked complete.</div>';};if($('copyPoem'))$('copyPoem').onclick=()=>{const t=lessons[page].labels.map((_,i)=>get(`${page}:line${i}`)).join('\n');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('Poem copied!')).catch(()=>window.prompt('Copy your poem:',t));else window.prompt('Copy your poem:',t)}}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.querySelectorAll('.quick-links [data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));function syncTabs(){const photo=document.querySelector('.hero-class-photo');if(photo)photo.hidden=$('room').value!=='Room 32';document.querySelectorAll('[data-room]').forEach(b=>{let on=b.dataset.room===$('room').value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});document.querySelectorAll('[data-group]').forEach(b=>{let on=b.dataset.group===$('group').value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{$('room').value=b.dataset.room;if(isRoom22())$('group').value='Storm';else $('group').value='Bulldogs';syncTabs();nav('lesson1')}));document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{if(isRoom22())return;$('group').value=b.dataset.group;syncTabs();nav('lesson1')}));syncTabs();render();
