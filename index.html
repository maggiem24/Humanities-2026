eaning natural without forcing rhymes.'],poem:'When someone feels left out and needs a chair,\nYou bring one over with a warm, bright smile.\nA simple act to show how much you care,\nCan make a heavy day feel well worthwhile.',labels:['A','B','A','B'],end:'Read your poem aloud. Do your A lines rhyme, and do your B lines rhyme? Does the message flow naturally?'}};
const guide={Bulldogs:{limerick:['Choose: helping a friend, sharing food, or cheering someone up.','Use rhyme bank A: day / play / way; B: smile / while.','Try the starter: “There once was a friend who would ___.”','Complete your five lines with help. Read them aloud.'],quatrain:['Choose a kind action: share, help, include, or listen.','Rhyme bank A: care / share; B: day / way.','Try: “I showed my friend that I could care...”','Write four lines using A B A B.']},Warriors:{limerick:['Choose a kind but funny situation.','Plan two rhyme families: A for lines 1, 2, 5; B for 3, 4.','Draft five lines, then adjust long and short lines.','Read aloud and improve one awkward rhythm.'],quatrain:['Decide on one clear message about kindness.','Plan two pairs of rhyming end-words.','Write four lines using ABAB.','Revise a line so the meaning stays natural.']},Panthers:{limerick:['Plan an original playful act of kindness.','Choose precise A and B rhyme families.','Compose five lines with an audible rhythmic contrast.','Revise word choice and rhythm, explaining your strongest change.'],quatrain:['Develop a clear message about compassion.','Choose a natural ABAB pattern without sacrificing meaning.','Use imagery and purposeful word choices.','Revise for coherence and explain the effect of your imagery.']},Storm:{limerick:['Explore how humour can communicate kindness without mocking others.','Create original AABBA rhyme families with unexpected vocabulary.','Craft deliberate rhythmic movement across long and short lines.','Evaluate the impact of tone and rhythm; produce a refined final version.'],quatrain:['Develop a nuanced message about compassion or belonging.','Craft an ABAB stanza with sophisticated but natural rhyme.','Use imagery, contrast, or symbolism to deepen the message.','Evaluate how structure and language shape a reader’s interpretation.']}};
function nav(p){page=p;stage=0;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'smooth'})}function header(t,s){return `<h2>${t}</h2><p class="muted">${s}</p>`}function progressBar(){return `<div class="progress"><div style="width:${completed()*50}%"></div></div><p class="small muted">${completed()} of 2 lessons completed in this room and group</p>`}
function home(){return `<div class="intro"><img class="cover" src="${lessons.limerick.img}" alt="Week 6 poetry lesson slide"><div>${header('Your Week 6 Poetry Tasks',`${esc($('room').value)} · ${esc($('group').value)} · ${esc(levels[$('group').value])}`)}<p class="small">Explore examples, plan your poem, write your own, and check your learning.</p></div></div>${progressBar()}<div class="cards">${Object.entries(lessons).map(([id,l],i)=>`<article class="task"><span class="num">TASK ${i+1} ${done(id)?'· ✓ COMPLETED':''}</span><h3>${esc(l.title)}</h3><p>${esc(l.sub)} Learn the ${l.scheme} pattern and complete the writing steps.</p><button class="btn" data-go="${id}">${done(id)?'Review lesson':'Open lesson'}</button></article>`).join('')}</div><div class="teacher"><h3>🌟 Today's Learning</h3><p class="muted">Open the Teacher Board for your room's IAMT, success criteria, and agenda.</p><button class="btn alt" data-go="teacher">View teacher board</button></div>`}
function lesson(id){const l=lessons[id],g=$('group').value,parts=['Learn','Explore','Plan','Write','Review'];let content='';if(stage===0){content=`<div class="lessonhead"><strong>IAMT (I am learning to):</strong> ${esc(l.sub)}<h3>Success Criteria</h3><ul class="criteria">${l.criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><p class="small">${id==='limerick'?'Lines 1, 2 and 5 are longer (often three beats). Lines 3 and 4 are shorter (often two beats). Read aloud to hear the rhythm.':'A quatrain has four lines. In ABAB, lines 1 and 3 rhyme; lines 2 and 4 rhyme.'}</p>`}if(stage===1){content=`<h3>Read and notice</h3><div class="poem">${esc(l.poem)}</div><div class="prompt"><label for="notice">What do you notice about the rhyme, rhythm or message?</label><textarea class="answer" id="notice" data-save="${id}:notice" placeholder="Write your observation..."></textarea></div><p class="small muted">${id==='limerick'?'Listen for the bounce. End words: bus, fuss, cheer, here, us.':'End words: chair, smile, care, worthwhile. Can you spot ABAB?'}</p>`}if(stage===2){content=`<h3>Your ${esc(g)} writing guide</h3><ol class="criteria">${guide[g][id].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="prompt"><label for="idea">My idea or message</label><textarea id="idea" class="answer" data-save="${id}:idea" placeholder="Plan your act of kindness or compassionate message..."></textarea></div><div class="prompt"><label for="rhymes">My rhyme bank (A and B words)</label><textarea id="rhymes" class="answer" data-save="${id}:rhymes" placeholder="A: ...   B: ..."></textarea></div>`}if(stage===3){content=`<h3>Write your poem</h3><p class="muted">${id==='limerick'?'Five lines · AABBA · longer, longer, shorter, shorter, longer':'Four lines · ABAB · one clear message'}</p>${l.labels.map((label,i)=>`<div class="prompt"><label for="line${i}">Line ${i+1} (${label})</label><input type="text" id="line${i}" data-save="${id}:line${i}" placeholder="Write line ${i+1} here..."></div>`).join('')}<button class="btn alt" id="copyPoem">Copy my poem</button>`}if(stage===4){content=`<h3>Read-aloud and reflection</h3><p>${esc(l.end)}</p><div class="poem" id="reviewPoem">${l.labels.map((x,i)=>esc(get(`${id}:line${i}`)||`Line ${i+1} not written yet`)).join('\n')}</div><div class="prompt"><label for="reflect">My reflection or exit ticket</label><textarea id="reflect" class="answer" data-save="${id}:reflect" placeholder="Explain your rhyme pattern and what you improved..."></textarea></div><div class="prompt"><label><input type="checkbox" id="checkRhyme"> I checked my rhyme pattern.</label><label><input type="checkbox" id="checkRead"> I read my poem aloud.</label><label><input type="checkbox" id="checkMeaning"> My poem communicates kindness or compassion.</label></div><button class="btn" id="finish">${done(id)?'✓ Lesson completed':'Mark lesson complete'}</button><div id="result"></div>`}return `<div class="intro"><img class="cover" src="${l.img}" alt="Original lesson slide"><div>${header(l.title,l.sub)}<span class="tag">${esc(levels[g])}</span></div></div><div class="steps">${parts.map((x,i)=>`<button class="step ${i===stage?'active':''}" data-stage="${i}">${i+1}. ${x}</button>`).join('')}</div>${content}<div class="row" style="margin-top:17px"><button class="btn ghost" id="back" ${stage===0?'disabled':''}>← Previous</button><button class="btn" id="next" ${stage===4?'disabled':''}>Next step →</button></div>`}
function progress(){return `${header('My Progress','Your completed lessons in this browser.')}${progressBar()}<div class="cards">${Object.entries(lessons).map(([id,l])=>`<div class="task"><h3>${esc(l.title)}</h3><p>${done(id)?'<span class="pill">✓ Completed</span>':'Not yet completed'}</p><button class="btn alt" data-go="${id}">Open task</button></div>`).join('')}</div><p class="small muted">Progress is saved only in this browser. It does not sync automatically across devices.</p>`}
function teacher(){return `${header('Teacher Board',`Editable notes for ${esc($('room').value)}.`)}<p class="small muted">These fields save on this device for this room. They are not shared with students on other devices unless you distribute an updated website.</p>${[['iamt','IAMT (I am learning to)'],['sc','Success Criteria'],['agenda','Agenda of the day'],['model','Teach and Model · Lesson Frontloading']].map(([id,label])=>`<div class="prompt"><label for="t${id}">${label}</label><textarea class="answer" style="min-height:${id==='model'?210:90}px" id="t${id}" data-teacher="${id}" placeholder="Type your ${label.toLowerCase()} here..."></textarea></div>`).join('')}<p class="feedback">Changes save automatically in this browser.</p>`}
function render(){ $('level').textContent=levels[$('group').value];$('content').innerHTML=page==='home'?home():page==='progress'?progress():page==='teacher'?teacher():lesson(page);document.querySelectorAll('[data-save]').forEach(el=>{el.value=get(el.dataset.save);el.addEventListener('input',()=>save(el.dataset.save,el.value))});document.querySelectorAll('[data-teacher]').forEach(el=>{const k='teacher:'+ $('room').value+':'+el.dataset.teacher;el.value=storage(k)||'';el.addEventListener('input',()=>storage(k,el.value))});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);render()});if($('back'))$('back').onclick=()=>{stage=Math.max(0,stage-1);render()};if($('next'))$('next').onclick=()=>{stage=Math.min(4,stage+1);render()};if($('finish'))$('finish').onclick=()=>{const l=lessons[page];if(l.labels.some((_,i)=>!get(`${page}:line${i}`).trim())){$('result').innerHTML='<div class="feedback warn">Please write all of your poem lines before completing the lesson.</div>';return}save('done:'+page,'yes');$('result').innerHTML='<div class="feedback">Great work! Your lesson is marked complete.</div>';};if($('copyPoem'))$('copyPoem').onclick=()=>{const t=lessons[page].labels.map((_,i)=>get(`${page}:line${i}`)).join('\n');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('Poem copied!')).catch(()=>window.prompt('Copy your poem:',t));else window.prompt('Copy your poem:',t)}}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>nav(b.dataset.page));function syncTabs(){document.querySelectorAll('[data-room]').forEach(b=>{let on=b.dataset.room===$('room').value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});document.querySelectorAll('[data-group]').forEach(b=>{let on=b.dataset.group===$('group').value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{$('room').value=b.dataset.room;syncTabs();nav('home')}));document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{$('group').value=b.dataset.group;syncTabs();nav('home')}));syncTabs();render();
</script></body></html>
